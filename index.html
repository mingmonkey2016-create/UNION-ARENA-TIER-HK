<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HONG KONG UNION ARENA TIER LIST</title>
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #1a1a1a; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin-bottom: 5px; color: #fff; text-align: center; font-size: 28px; letter-spacing: 1px; }
        .instructions { font-size: 13px; color: #aaa; margin-bottom: 20px; text-align: center; }
        
        .status-bar { margin-bottom: 25px; font-size: 14px; background: #222; padding: 10px 20px; border-radius: 20px; border: 1px solid #444; display: flex; gap: 15px; align-items: center; }
        .status-badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; background: #28a745; color: white; }

        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        button, .custom-file-upload { background: #333; color: white; border: 1px solid #555; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; user-select: none; }
        button:hover, .custom-file-upload:hover { background: #444; }
        .btn-add { background: #28a745; border-color: #218838; }
        .btn-add:hover { background: #218838; }
        .btn-delete { background: #dc3545; border-color: #bd2130; }
        .btn-delete:hover { background: #bd2130; }
        input[type="file"] { display: none; }

        #tier-container { width: 100%; max-width: 850px; background: #111; border: 2px solid #333; }
        .tier-row { display: flex; border-bottom: 2px solid #333; min-height: 90px; }
        .tier-row:last-child { border-bottom: none; }
        
        .tier-label { width: 100px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; color: black; text-shadow: 0 1px 2px rgba(255,255,255,0.3); user-select: none; text-align: center; border: none; outline: none; padding: 5px; word-break: break-all; cursor: pointer; }
        .tier-label:focus { background-color: #fff !important; color: #000 !important; text-shadow: none; }
        
        .t-s { background-color: #ff7f7f; }
        .t-a { background-color: #ffbf7f; }
        .t-b { background-color: #ffdf7f; }
        .t-c { background-color: #ffff7f; }
        .t-d { background-color: #bfff7f; }
        .t-e { background-color: #7fff7f; }
        .t-f { background-color: #7f9fff; }

        .tier-list { flex: 1; display: flex; flex-wrap: wrap; padding: 8px; gap: 8px; min-height: 90px; background: #1a1a1a; transition: background-color 0.2s; }
        
        .bank-container { width: 100%; max-width: 850px; margin-top: 30px; background: #222; padding: 15px; border-radius: 8px; border: 1px dashed #555; }
        .bank-container h3 { margin-bottom: 10px; font-size: 16px; color: #aaa; }
        #item-bank { display: flex; flex-wrap: wrap; gap: 8px; min-height: 110px; }

        .item { width: 74px; height: 104px; background-size: cover; background-position: center; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 2px 5px rgba(0,0,0,0.5); background-color: #333; cursor: grab; }
        .item:active { cursor: grabbing; }
        .drag-over { background-color: #2d2d2d !important; border: 2px dashed #888; }
    </style>
</head>
<body>

    <h1>HONG KONG UNION ARENA TIER LIST</h1>
    <div class="instructions">💡 提示：您可以直接上傳圖片，拖拽卡牌，或點擊左側字母修改標籤文字！</div>
    
    <div class="status-bar">
        <div>
            目前權限：<span class="status-badge">⚡ 管理員模式（免密碼解鎖）</span>
        </div>
    </div>

    <div class="controls">
        <label for="file-upload" class="custom-file-upload">📁 上傳卡牌圖片</label>
        <input id="file-upload" type="file" multiple accept="image/*" onchange="handleUpload(this.files)">
        <button class="btn-add" onclick="addTierRow()">➕ 新增一列</button>
        <button class="btn-delete" onclick="removeLastRow()">➖ 刪除最後一列</button>
        <button onclick="downloadTierList()">💾 下載排行榜圖片 (PNG)</button>
    </div>

    <div id="tier-container">
        <div class="tier-row"><div class="tier-label t-s" contenteditable="true">S</div><div class="tier-list"></div></div>
        <div class="tier-row"><div class="tier-label t-a" contenteditable="true">A</div><div class="tier-list"></div></div>
        <div class="tier-row"><div class="tier-label t-b" contenteditable="true">B</div><div class="tier-list"></div></div>
        <div class="tier-row"><div class="tier-label t-c" contenteditable="true">C</div><div class="tier-list"></div></div>
        <div class="tier-row"><div class="tier-label t-d" contenteditable="true">D</div><div class="tier-list"></div></div>
        <div class="tier-row"><div class="tier-label t-e" contenteditable="true">E</div><div class="tier-list"></div></div>
        <div class="tier-row"><div class="tier-label t-f" contenteditable="true">F</div><div class="tier-list"></div></div>
    </div>

    <div class="bank-container">
        <h3>📦 待分配卡牌倉庫（請將卡牌拖曳至上方表格）</h3>
        <div id="item-bank"></div>
    </div>

    <script>
        const colorPalette = ['#ff7f7f', '#ffbf7f', '#ffdf7f', '#ffff7f', '#bfff7f', '#7fff7f', '#7f9fff', '#bf7fff', '#ff7fbf'];
        let draggedItem = null;

        window.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.item').forEach(makeItemDraggable);
            enableDropZones();
        });

        function makeItemDraggable(item) {
            item.draggable = true;
            item.addEventListener('dragstart', function(e) {
                draggedItem = this;
                setTimeout(() => this.style.opacity = '0.3', 0);
            });
            item.addEventListener('dragend', function() {
                this.style.opacity = '1';
                draggedItem = null;
            });
        }

        function enableDropZones() {
            const zones = document.querySelectorAll('.tier-list, #item-bank');
            zones.forEach(zone => {
                zone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.classList.add('drag-over');
                });
                zone.addEventListener('dragleave', function() {
                    this.classList.remove('drag-over');
                });
                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('drag-over');
                    if (draggedItem) {
                        this.appendChild(draggedItem);
                    }
                });
            });
        }

        function addTierRow() {
            const container = document.getElementById('tier-container');
            const currentRows = container.querySelectorAll('.tier-row').length;
            
            const newRow = document.createElement('div');
            newRow.className = 'tier-row';

            const newLabel = document.createElement('div');
            newLabel.className = 'tier-label';
            newLabel.contentEditable = "true";
            newLabel.innerText = 'NEW';
            newLabel.style.backgroundColor = colorPalette[currentRows % colorPalette.length];
            bindLabelEvents(newLabel);

            const newList = document.createElement('div');
            newList.className = 'tier-list';

            newRow.appendChild(newLabel);
            newRow.appendChild(newList);
            container.appendChild(newRow);

            enableDropZones();
        }

        function removeLastRow() {
            const container = document.getElementById('tier-container');
            const rows = container.querySelectorAll('.tier-row');
            
            if (rows.length > 1) {
                const lastRow = rows[rows.length - 1];
                const lastList = lastRow.querySelector('.tier-list');
                const bank = document.getElementById('item-bank');

                const remainingItems = lastList.querySelectorAll('.item');
                remainingItems.forEach(item => bank.appendChild(item));

                lastRow.remove();
            } else {
                alert('最少必須保留一個階級級別！');
            }
        }

        function handleUpload(files) {
            const bank = document.getElementById('item-bank');
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newItem = document.createElement('div');
                    newItem.className = 'item';
                    newItem.style.backgroundImage = `url('${e.target.result}')`;
                    makeItemDraggable(newItem);
                    bank.appendChild(newItem);
                };
                reader.readAsDataURL(file);
            });
        }

        function downloadTierList() {
            const container = document.getElementById('tier-container');
            document.activeElement.blur();

            html2canvas(container, { backgroundColor: '#111' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'union-arena-tier-list.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function bindLabelEvents(label) {
            label.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    this.blur();
                }
            });
        }

        document.querySelectorAll('.tier-label').forEach(bindLabelEvents);
    </script>
